<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="neonBrand">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Glow -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGradBrand)" stroke="url(#shieldBorder)" stroke-width="3" filter="url(#neonBrand)"/>
  <circle cx="100" cy="100" r="76" fill="#0B0F19" stroke="#374151" stroke-width="1.5"/>

  <!-- Speedometer / Crest Emblem -->
  <path d="M 60,120 A 50,50 0 1,1 140,120" fill="none" stroke="#4B5563" stroke-width="8" stroke-linecap="round"/>
  <path d="M 60,120 A 50,50 0 0,1 115,53" fill="none" stroke="url(#shieldBorder)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Needle -->
  <line x1="100" y1="100" x2="125" y2="70" stroke="#EF4444" stroke-width="4" stroke-linecap="round" filter="url(#neonBrand)"/>
  <circle cx="100" cy="100" r="7" fill="#F3F4F6"/>
  <circle cx="100" cy="100" r="3" fill="#EF4444"/>

  <!-- Subtext -->
  <text x="100" y="145" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">
    TOPSPEED
  </text>
  <text x="100" y="160" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#EF4444" text-anchor="middle" letter-spacing="1">
    MARQUE
  </text>
</svg>
