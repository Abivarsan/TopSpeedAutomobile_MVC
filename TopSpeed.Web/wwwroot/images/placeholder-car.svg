<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#374151" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Ground Shadow & Glow -->
  <ellipse cx="400" cy="335" rx="310" ry="18" fill="#000000" opacity="0.7"/>
  <ellipse cx="400" cy="335" rx="260" ry="8" fill="#EF4444" opacity="0.3" filter="url(#neon)"/>

  <!-- Supercar Silhouette Path -->
  <g transform="translate(100, 110)">
    <!-- Car Body -->
    <path d="M 60,195 
             C 80,185 110,180 150,175 
             L 220,135 
             C 270,105 340,95 430,105 
             L 500,145 
             C 540,165 570,185 580,200 
             L 560,205 
             C 545,185 510,180 480,180 
             C 450,180 435,200 430,205 
             L 210,205 
             C 200,185 170,180 140,180 
             C 110,180 80,195 70,205 Z" 
          fill="url(#carBody)" stroke="#4B5563" stroke-width="2"/>

    <!-- Aerodynamic Speed Line Highlight -->
    <path d="M 80,190 C 130,178 220,132 320,108 C 420,98 490,140 565,195" 
          fill="none" stroke="url(#glowRed)" stroke-width="3.5" filter="url(#neon)"/>

    <!-- Front & Rear Wheel Arches & Rims -->
    <!-- Rear Wheel -->
    <circle cx="150" cy="205" r="34" fill="#0F172A" stroke="#4B5563" stroke-width="3"/>
    <circle cx="150" cy="205" r="24" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <circle cx="150" cy="205" r="10" fill="#EF4444" opacity="0.8"/>

    <!-- Front Wheel -->
    <circle cx="470" cy="205" r="34" fill="#0F172A" stroke="#4B5563" stroke-width="3"/>
    <circle cx="470" cy="205" r="24" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    <circle cx="470" cy="205" r="10" fill="#EF4444" opacity="0.8"/>

    <!-- Cockpit & Windshield -->
    <path d="M 235,135 L 305,115 C 365,110 415,115 445,142 L 395,145 C 335,145 275,140 235,135 Z" 
          fill="#0B0F17" stroke="#374151" stroke-width="1.5"/>

    <!-- Headlight Laser Glow -->
    <polygon points="560,195 585,190 580,200" fill="#F59E0B" filter="url(#neon)"/>
    <!-- Taillight Neon Slice -->
    <line x1="60" y1="195" x2="85" y2="190" stroke="#EF4444" stroke-width="4" stroke-linecap="round" filter="url(#neon)"/>
  </g>

  <!-- Typography Badge -->
  <text x="400" y="385" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#9CA3AF" text-anchor="middle" letter-spacing="4">
    TOPSPEED AUTOMOTIVE
  </text>
  <text x="400" y="410" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#EF4444" text-anchor="middle" letter-spacing="2">
    PERFORMANCE VEHICLE SHOWCASE
  </text>
</svg>
